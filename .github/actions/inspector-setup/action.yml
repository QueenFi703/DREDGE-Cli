name: Inspector Setup
description: >
  Sets up Node.js (v24 LTS), installs npm dependencies, and compiles the
  actions-run-inspector TypeScript package. Intended to be reused by every
  job in the Actions Run Inspector workflow.

runs:
  using: composite
  steps:
    - name: Setup Node 24
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Install
      working-directory: github-app/actions-run-inspector
      shell: bash
      run: npm install

    - name: Build
      working-directory: github-app/actions-run-inspector
      shell: bash
      run: npm run build
