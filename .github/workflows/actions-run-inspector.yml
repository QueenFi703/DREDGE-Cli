name: Actions Run Inspector
# checkov:skip=CKV_GHA_7: workflow_dispatch inputs are required for manual run inspection; inputs are validated at runtime

on:
  workflow_dispatch:
    inputs:
      owner:
        required: false
      repo:
        required: false
      run_id:
        required: false
      run_url:
        required: false
      workflow_id:
        description: "Workflow file name or ID to inspect the latest run of (e.g. android.yml)"
        required: false
      post_comment:
        required: false
        default: "false"
      comment_url:
        required: false

  schedule:
    - cron: "0 */12 * * *"

permissions:
  contents: read

jobs:
  inspector:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITHUB_APP_ID: ${{ secrets.GITHUB_APP_ID }}
      GITHUB_APP_INSTALLATION_ID: ${{ secrets.GITHUB_APP_INSTALLATION_ID }}
      GITHUB_APP_PRIVATE_KEY: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/inspector-setup

      - name: Run Inspector
        working-directory: github-app/actions-run-inspector
        env:
          owner: ${{ github.event.inputs.owner || github.repository_owner }}
          repo:  ${{ github.event.inputs.repo  || github.event.repository.name }}
          run_id: ${{ github.event.inputs.run_id }}
          run_url: ${{ github.event.inputs.run_url }}
          workflow_id: ${{ github.event.inputs.workflow_id }}
          post_comment: ${{ github.event.inputs.post_comment }}
          comment_url: ${{ github.event.inputs.comment_url }}
        run: npm start

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: run-inspector-result
          path: github-app/actions-run-inspector/result.json

  # Scheduled cross-repo monitoring for QueenFi703/amazon-iap-kotlin
  inspect-amazon-iap:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITHUB_APP_ID: ${{ secrets.GITHUB_APP_ID }}
      GITHUB_APP_INSTALLATION_ID: ${{ secrets.GITHUB_APP_INSTALLATION_ID }}
      GITHUB_APP_PRIVATE_KEY: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      matrix:
        include:
          - workflow_id: android.yml
            artifact: run-inspector-amazon-iap-android
          - workflow_id: aws-gradle-pipeline.yml
            artifact: run-inspector-amazon-iap-aws-pipeline

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/inspector-setup

      - name: Inspect latest ${{ matrix.workflow_id }} run
        working-directory: github-app/actions-run-inspector
        env:
          owner: QueenFi703
          repo: amazon-iap-kotlin
          workflow_id: ${{ matrix.workflow_id }}
        run: npm start

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: github-app/actions-run-inspector/result.json
