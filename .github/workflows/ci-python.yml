name: Python CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install pytest pytest-cov

      - name: Run tests
        run: pytest tests/ -v --cov=src/dredge --cov-report=term-missing

      - name: Test CLI commands
        run: |
          dredge-cli --version
          dredge-cli --help

      - name: Report build to Grafana Cloud
        if: always()
        uses: ./.github/actions/grafana-build-report
        with:
          status: ${{ job.status }}
          logs_url: ${{ secrets.GCLOUD_HOSTED_LOGS_URL }}
          logs_id: ${{ secrets.GCLOUD_HOSTED_LOGS_ID }}
          api_key: ${{ secrets.GCLOUD_RW_API_KEY }}
          grafana_url: ${{ secrets.GCLOUD_GRAFANA_URL }}
          extra_labels: '{"python_version":"${{ matrix.python-version }}"}'
