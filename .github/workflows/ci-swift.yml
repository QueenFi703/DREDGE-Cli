# Swift CI — macOS runner, builds and tests using Swift Package Manager
# Adjust commands if your project uses an Xcode workspace / scheme instead of SPM.
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  swift-test:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Show Swift version
        run: swift --version

      - name: Cache SwiftPM build artifacts
        uses: actions/cache@v5
        with:
          # cache SPM build folder and package checkouts
          path: |
            .build
            .swiftpm
          key: ${{ runner.os }}-swift-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swift-

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build
        run: swift build --configuration release

      - name: Run tests
        run: swift test

      - name: Report build to Grafana Cloud
        if: always()
        uses: ./.github/actions/grafana-build-report
        with:
          status: ${{ job.status }}
          logs_url: ${{ secrets.GCLOUD_HOSTED_LOGS_URL }}
          logs_id: ${{ secrets.GCLOUD_HOSTED_LOGS_ID }}
          api_key: ${{ secrets.GCLOUD_RW_API_KEY }}
          grafana_url: ${{ secrets.GCLOUD_GRAFANA_URL }}
