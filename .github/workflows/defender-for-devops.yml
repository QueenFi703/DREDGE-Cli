# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
#
# Microsoft Security DevOps (MSDO) is a command line application which integrates static analysis tools into the development cycle.
# MSDO installs, configures and runs the latest versions of static analysis tools
# (including, but not limited to, SDL/security and compliance tools).
#
# For more information about the action, check out https://github.com/microsoft/security-devops-action
#
# Please note this workflow does not integrate your GitHub Org with Microsoft Defender For DevOps. You have to create an integration
# and provide permission before this can report data back to azure.
# Read the official documentation here : https://learn.microsoft.com/en-us/azure/defender-for-cloud/quickstart-onboard-github
#
# This workflow runs on ubuntu-latest (Linux). Bandit and Checkov are installed
# via pip before the MSDO action runs so that Linux-native tool binaries are used
# instead of Windows redistributables.

name: "Microsoft Defender For Devops"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '41 10 * * 0'

permissions:
  contents: read
  security-events: write

jobs:
  MSDO:
    # Run on Linux so that Linux-native tool binaries are used (not Windows .exe redistributables).
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-msdo-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-msdo-

      - name: Install Bandit and Checkov
        run: |
          python -m pip install --upgrade pip
          pip install bandit checkov

      - name: Run Microsoft Security DevOps
        uses: microsoft/security-devops-action@v1
        id: msdo
        continue-on-error: true
        with:
          tools: bandit,checkov

      - name: Upload results to Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always() && steps.msdo.outputs.sarifFile != ''
        with:
          sarif_file: ${{ steps.msdo.outputs.sarifFile }}
