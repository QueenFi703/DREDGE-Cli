name: Defender for DevOps (Linux Compatible)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

jobs:
  security-scan:
    name: Security Scan (Bandit + Checkov)
    runs-on: ubuntu-latest
    env:
      # Optional proxy/tunnel routing. Set these in repository variables/secrets
      # when running in a restricted network environment.
      HTTP_PROXY: ${{ secrets.HTTP_PROXY || vars.HTTP_PROXY }}
      HTTPS_PROXY: ${{ secrets.HTTPS_PROXY || vars.HTTPS_PROXY }}
      NO_PROXY: ${{ secrets.NO_PROXY || vars.NO_PROXY }}

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v6

      - name: 🐍 Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: ⚡ Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 📦 Install security tools
        run: |
          python -m pip install --upgrade pip
          if [ -n "${HTTPS_PROXY}" ]; then
            python -m pip config set global.proxy "${HTTPS_PROXY}"
          elif [ -n "${HTTP_PROXY}" ]; then
            python -m pip config set global.proxy "${HTTP_PROXY}"
          fi
          pip install 'bandit[sarif]' checkov

      - name: Run Bandit (SARIF)
        run: |
          set -euo pipefail
          bandit -r . -f sarif -o bandit.sarif --exit-zero

      - name: Run Checkov (SARIF)
        run: |
          set -euo pipefail
          mkdir -p checkov-output
          checkov -d . -o sarif --output-file-path checkov-output --soft-fail
          cp checkov-output/results_sarif.sarif checkov.sarif

      - name: Verify SARIF files
        id: verify_sarif
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          for filename, tool in [('bandit.sarif', 'bandit'), ('checkov.sarif', 'checkov')]:
              report = json.loads(Path(filename).read_text())
              assert report.get('version') == '2.1.0', f'Invalid SARIF version: {filename}'
              runs = report.get('runs')
              assert isinstance(runs, list) and runs, f'No scanner runs: {filename}'
              assert all(run.get('tool', {}).get('driver', {}).get('name', '').lower() == tool
                         for run in runs), f'Unexpected scanner: {filename}'
              print(f'Validated {filename}')
          PY

      - name: Upload Bandit SARIF
        if: always() && steps.verify_sarif.outcome == 'success'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: bandit.sarif

      - name: Upload Checkov SARIF
        if: always() && steps.verify_sarif.outcome == 'success'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: checkov.sarif

