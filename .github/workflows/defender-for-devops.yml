name: Defender for DevOps (Linux Compatible)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

jobs:
  security-scan:
    name: Security Scan (Bandit + Checkov)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v6

      - name: 🐍 Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: ⚡ Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 📦 Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit checkov

      # -----------------------------
      # Bandit (Python SAST)
      # -----------------------------
      - name: 🔍 Run Bandit (SARIF)
        run: |
          set -euo pipefail
          rm -f bandit.sarif results_sarif.sarif
          bandit -r . -f sarif -o bandit.sarif || true

          # Some Bandit versions only emit results_sarif.sarif.
          if [ ! -s bandit.sarif ] && [ -s results_sarif.sarif ]; then
            mv results_sarif.sarif bandit.sarif
          fi

      # -----------------------------
      # Checkov (IaC scanning)
      # -----------------------------
      - name: 🔍 Run Checkov (SARIF)
        run: |
          set -euo pipefail
          rm -f checkov.sarif results_sarif.sarif
          checkov -d . -o sarif > checkov.sarif || true

          # Some Checkov versions emit results_sarif.sarif instead of stdout.
          if [ ! -s checkov.sarif ] && [ -s results_sarif.sarif ]; then
            mv results_sarif.sarif checkov.sarif
          fi

      # -----------------------------
      # Ensure SARIF files exist and are valid JSON
      # -----------------------------
      - name: 🧪 Verify SARIF files
        run: |
          set -euo pipefail
          ls -lah *.sarif
          test -s bandit.sarif
          test -s checkov.sarif
          python -m json.tool bandit.sarif >/dev/null
          python -m json.tool checkov.sarif >/dev/null

      # -----------------------------
      # Upload results to GitHub Security tab
      # -----------------------------
      - name: 📤 Upload Bandit SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: bandit.sarif

      - name: 📤 Upload Checkov SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: checkov.sarif
