name: Defender for DevOps (Linux Compatible)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

jobs:
  security-scan:
    name: Security Scan (Bandit + Checkov)
    runs-on: ubuntu-latest
    env:
      # Optional proxy/tunnel routing. Set these in repository variables/secrets
      # when running in a restricted network environment.
      HTTP_PROXY: ${{ secrets.HTTP_PROXY || vars.HTTP_PROXY }}
      HTTPS_PROXY: ${{ secrets.HTTPS_PROXY || vars.HTTPS_PROXY }}
      NO_PROXY: ${{ secrets.NO_PROXY || vars.NO_PROXY }}

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v6

      - name: 🐍 Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: ⚡ Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 📦 Install security tools
        run: |
          python -m pip install --upgrade pip
          if [ -n "${HTTPS_PROXY}" ]; then
            python -m pip config set global.proxy "${HTTPS_PROXY}"
          elif [ -n "${HTTP_PROXY}" ]; then
            python -m pip config set global.proxy "${HTTP_PROXY}"
          fi
          pip install bandit checkov

      # -----------------------------
      # Bandit (Python SAST)
      # -----------------------------
      - name: 🔍 Run Bandit (SARIF)
        run: |
          bandit -r . \
            -f sarif \
            -o bandit.sarif || true
          if [ ! -s bandit.sarif ]; then
            printf '%s\n' '{"version":"2.1.0","runs":[]}' > bandit.sarif
          fi

      # -----------------------------
      # Checkov (IaC scanning)
      # -----------------------------
      - name: 🔍 Run Checkov (SARIF)
        run: |
          checkov -d . \
            -o sarif \
            --output-file-path checkov.sarif || true
          if [ ! -s checkov.sarif ]; then
            printf '%s\n' '{"version":"2.1.0","runs":[]}' > checkov.sarif
          fi

      # -----------------------------
      # Ensure SARIF exists
      # -----------------------------
      - name: 🧪 Verify SARIF files
        run: |
          set -euo pipefail
          ls -lah *.sarif
          test -s bandit.sarif
          test -s checkov.sarif
          python -m json.tool bandit.sarif >/dev/null
          python -m json.tool checkov.sarif >/dev/null

      # -----------------------------
      # Upload results to GitHub Security tab
      # -----------------------------
      - name: 📤 Upload Bandit SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: bandit.sarif

      - name: 📤 Upload Checkov SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: checkov.sarif
