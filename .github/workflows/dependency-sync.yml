# Cross-Repo Dependency Sync
#
# Emits a repository_dispatch event to every target repository listed in
# .github/dep-sync-config.json whenever a dependency manifest changes on
# main, a release is published, or the workflow is triggered manually.
#
# Requirements:
#   - Set the CROSS_REPO_DISPATCH_TOKEN repository secret to a GitHub PAT
#     with the `repo` scope for each target repository.  GITHUB_TOKEN is
#     scoped to this repository only and cannot dispatch to others.
#
# Payload safety:
#   - All JSON is constructed with `jq --arg` so user-supplied values
#     (including the TRIGGER_REASON workflow_dispatch input) are always
#     properly escaped and cannot produce invalid JSON or inject content.

name: Cross-Repo Dependency Sync
# checkov:skip=CKV_GHA_7: workflow_dispatch inputs are required for manual sync with validated, jq-escaped payload construction

on:
  push:
    branches:
      - main
    paths:
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'Package.swift'
      - 'Package.resolved'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target_repos:
        description: >
          Comma-separated list of owner/repo targets to notify.
          Defaults to the list in .github/dep-sync-config.json.
        required: false
        default: ''
      trigger_reason:
        description: 'Human-readable reason for this manual sync (included in dispatch payload)'
        required: false
        default: 'manual dispatch'

permissions:
  contents: read

jobs:
  emit-dependency-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 2   # needed for git diff HEAD~1

      - name: Build dependency sync payload
        id: build_payload
        env:
          EVENT_NAME:     ${{ github.event_name }}
          SOURCE_REPO:    ${{ github.repository }}
          SOURCE_SHA:     ${{ github.sha }}
          SOURCE_REF:     ${{ github.ref }}
          RUN_ID:         ${{ github.run_id }}
          # Inputs are empty strings when not a workflow_dispatch; the
          # jq --arg below handles them safely in all cases.
          TRIGGER_REASON: ${{ github.event.inputs.trigger_reason || 'automated' }}
        run: |
          set -euo pipefail

          # Detect which dependency manifests changed (push only; empty array otherwise)
          CHANGED_DEPS="[]"
          if [ "${EVENT_NAME}" = "push" ]; then
            CHANGED_DEPS=$(
              git diff --name-only HEAD~1 HEAD 2>/dev/null \
                | grep -E '^(requirements\.txt|pyproject\.toml|Package\.swift|Package\.resolved)$' \
                | jq -R -s 'split("\n") | map(select(length > 0))' \
              || echo "[]"
            )
          fi

          # Build the payload JSON via jq so every string field is correctly
          # escaped — including TRIGGER_REASON which comes from user input.
          jq -n \
            --arg source_repo    "${SOURCE_REPO}" \
            --arg source_sha     "${SOURCE_SHA}" \
            --arg source_ref     "${SOURCE_REF}" \
            --arg run_id         "${RUN_ID}" \
            --arg trigger_event  "${EVENT_NAME}" \
            --arg trigger_reason "${TRIGGER_REASON}" \
            --argjson changed_files "${CHANGED_DEPS}" \
            '{
              source_repo:               $source_repo,
              source_sha:                $source_sha,
              source_ref:                $source_ref,
              run_id:                    $run_id,
              trigger_event:             $trigger_event,
              trigger_reason:            $trigger_reason,
              changed_dependency_files:  $changed_files
            }' | tee /tmp/sync_signal.json

          PAYLOAD_B64=$(base64 -w 0 /tmp/sync_signal.json)
          echo "payload_b64=${PAYLOAD_B64}" >> "${GITHUB_OUTPUT}"

      - name: Resolve target repositories
        id: resolve_targets
        env:
          INPUT_REPOS: ${{ github.event.inputs.target_repos }}
        run: |
          set -euo pipefail

          # Prefer the workflow_dispatch input; fall back to dep-sync-config.json
          if [ -n "${INPUT_REPOS:-}" ]; then
            # Convert comma list to JSON array via jq for consistent handling.
            # Avoid grep so an empty input does not fail under pipefail.
            TARGET_REPOS_JSON=$(
              printf '%s' "${INPUT_REPOS}" \
                | tr ',' '\n' \
                | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' \
                | jq -R -s 'split("\n") | map(select(length > 0))'
            )
          else
            TARGET_REPOS_JSON=$(jq -c '.target_repos // []' .github/dep-sync-config.json)
          fi

          # Guard against empty/invalid JSON to prevent downstream jq parse errors.
          if ! printf '%s' "${TARGET_REPOS_JSON:-}" | jq -e 'type == "array"' >/dev/null; then
            echo "::warning::Resolved target repositories value is invalid JSON; defaulting to empty list."
            TARGET_REPOS_JSON='[]'
          fi

          echo "repos=${TARGET_REPOS_JSON}" >> "${GITHUB_OUTPUT}"

      - name: Emit cross-repo dependency sync signal
        env:
          CROSS_REPO_DISPATCH_TOKEN: ${{ secrets.CROSS_REPO_DISPATCH_TOKEN }}
          SOURCE_REPO:    ${{ github.repository }}
          SOURCE_SHA:     ${{ github.sha }}
          SOURCE_REF:     ${{ github.ref }}
          RUN_ID:         ${{ github.run_id }}
          TRIGGER_REASON: ${{ github.event.inputs.trigger_reason || 'automated' }}
          TARGET_REPOS_JSON: ${{ steps.resolve_targets.outputs.repos }}
        run: |
          set -euo pipefail

          # GITHUB_TOKEN is scoped to this repository and cannot dispatch to
          # other repos; a dedicated PAT is required.
          if [ -z "${CROSS_REPO_DISPATCH_TOKEN:-}" ]; then
            echo "::warning::CROSS_REPO_DISPATCH_TOKEN secret is not set." \
                 " Cross-repo dispatch requires a PAT with 'repo' scope on" \
                 " each target repository. Set this secret to enable delivery."
            exit 0
          fi

          # Build the repository_dispatch body via jq — TRIGGER_REASON is an
          # --arg so quotes, newlines, and other special characters are escaped.
          DISPATCH_BODY=$(jq -n \
            --arg source_repo    "${SOURCE_REPO}" \
            --arg source_sha     "${SOURCE_SHA}" \
            --arg source_ref     "${SOURCE_REF}" \
            --arg run_id         "${RUN_ID}" \
            --arg trigger_reason "${TRIGGER_REASON}" \
            '{
              event_type: "dependency-sync",
              client_payload: {
                source_repo:    $source_repo,
                source_sha:     $source_sha,
                source_ref:     $source_ref,
                run_id:         $run_id,
                trigger_reason: $trigger_reason
              }
            }')

          DISPATCH_ERRORS=0
          # Iterate over the JSON array of repo slugs
          while IFS= read -r REPO; do
            # jq outputs quoted strings; strip the surrounding quotes
            REPO=$(printf '%s' "${REPO}" | tr -d '"')
            [ -z "${REPO}" ] && continue

            echo "→ Dispatching dependency-sync event to: ${REPO}"

            HTTP_STATUS=$(curl -s \
              -o /tmp/dispatch_response.json \
              -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer ${CROSS_REPO_DISPATCH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/dispatches" \
              -d "${DISPATCH_BODY}")

            if [ "${HTTP_STATUS}" -eq 204 ]; then
              echo "  ✅ Dispatched to ${REPO} (HTTP ${HTTP_STATUS})"
            else
              RESPONSE_BODY=$(cat /tmp/dispatch_response.json 2>/dev/null || echo "(no body)")
              echo "  ⚠️  Dispatch to ${REPO} returned HTTP ${HTTP_STATUS}: ${RESPONSE_BODY}"
              DISPATCH_ERRORS=$((DISPATCH_ERRORS + 1))
            fi
          done < <(printf '%s' "${TARGET_REPOS_JSON}" | jq -c '.[]')

          if [ "${DISPATCH_ERRORS}" -gt 0 ]; then
            echo "::warning::${DISPATCH_ERRORS} repository_dispatch call(s) failed." \
                 " Ensure CROSS_REPO_DISPATCH_TOKEN has 'repo' scope for each target."
          fi

          echo "Cross-repo dependency sync signal emission complete."

      - name: Upload sync signal artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-sync-signal
          path: /tmp/sync_signal.json
          if-no-files-found: warn

      - name: Job Summary
        if: always()
        env:
          TARGET_REPOS_JSON: ${{ steps.resolve_targets.outputs.repos }}
        run: |
          set -euo pipefail
          {
            echo "# Cross-Repo Dependency Sync"
            echo ""
            echo "**Source Repository:** \`${GITHUB_REPOSITORY}\`"
            echo "**Commit SHA:** \`${GITHUB_SHA}\`"
            echo "**Ref:** \`${GITHUB_REF}\`"
            echo "**Trigger:** \`${GITHUB_EVENT_NAME}\`"
            echo ""
            echo "## Target Repositories"
            printf '%s' "${TARGET_REPOS_JSON}" \
              | jq -r '.[]' \
              | while IFS= read -r repo; do
                  echo "- \`${repo}\`"
                done
            echo ""
            if [ -f /tmp/sync_signal.json ]; then
              echo "## Dispatch Payload"
              echo '```json'
              cat /tmp/sync_signal.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
