name: Deploy DREDGE to GitHub Pages

# Vercel is deliberately outside the DREDGE release gate.
# A Vercel account/project restriction must not block GitHub Pages,
# Swift CI, or the TestFlight release pipeline.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask python-dotenv authlib flask-login gunicorn

      - name: Build DREDGE server
        run: |
          mkdir -p build
          cp -r src build/
          cp -r dredge-cli-repo/src/dredge/static build/static 2>/dev/null || true

      - name: Create API proxy documentation
        run: |
          mkdir -p docs
          cat > docs/API_ENDPOINTS.md << 'EOF'
# DREDGE API Endpoints

## Deployment boundary

GitHub Pages is the documentation deployment path for this workflow.
Vercel is an optional external deployment target and is **not a release gate**.
A Vercel account, billing, project, or deployment restriction must not block
DREDGE CI or the iOS TestFlight release pipeline.

## Health & Status
- `GET /health` - System health
- `GET /api/gordon/health` - Gordon bridge health
- `GET /api/architecture/health` - Architecture health

## Release gates
The authoritative DREDGE release gates are:
1. Swift package validation/tests
2. iOS archive/export
3. Code signing/provisioning validation
4. App Store Connect/TestFlight upload

Vercel deployment status is informational only.
EOF

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v2
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2

  test-pages:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Record Pages deployment boundary
        run: |
          echo "GitHub Pages documentation deployment completed."
          echo "Vercel remains optional and does not gate DREDGE release readiness."
