name: Docker Image CI/CD

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write

    strategy:
      fail-fast: false

      matrix:
        include:
          - target: cpu-build
            suffix: cpu
            platforms: linux/amd64,linux/arm64

          - target: gpu-build
            suffix: gpu
            platforms: linux/amd64

          - target: dev
            suffix: dev
            platforms: linux/amd64,linux/arm64

    steps:
      ####################################################################
      # Phase 1 — Checkout
      ####################################################################

      - name: Checkout repository
        uses: actions/checkout@v4

      ####################################################################
      # Phase 2 — Build Environment
      ####################################################################

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Free disk space
        run: |
          echo "=== Disk cleanup start ==="

          df -h

          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true

          docker system prune -af --volumes || true

          echo "=== Disk cleanup complete ==="

          df -h

      ####################################################################
      # Phase 3 — Registry Login
      ####################################################################

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      ####################################################################
      # Phase 4 — Docker Metadata
      ####################################################################

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5

        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

          tags: |
            type=ref,event=branch,suffix=-${{ matrix.suffix }}
            type=ref,event=tag,suffix=-${{ matrix.suffix }}
            type=sha,suffix=-${{ matrix.suffix }}

          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}

      ####################################################################
      # Phase 5 — Build + Push
      ####################################################################

      - name: Build and push Docker image
        id: build

        uses: docker/build-push-action@v6

        with:
          context: .

          target: ${{ matrix.target }}

          platforms: ${{ matrix.platforms }}

          push: ${{ github.event_name != 'pull_request' }}

          tags: ${{ steps.meta.outputs.tags }}

          labels: ${{ steps.meta.outputs.labels }}

          cache-from: type=gha,scope=${{ matrix.target }}

          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

          provenance: false

          build-args: |
            BUILDKIT_INLINE_CACHE=1

      ####################################################################
      # Phase 6 — Attestation
      ####################################################################

      - name: Generate artifact attestation
        if: github.event_name != 'pull_request' && steps.build.outputs.digest != ''

        uses: actions/attest-build-provenance@v2

        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      ####################################################################
      # Phase 7 — Trivy Security Scan
      ####################################################################

      - name: Run Trivy vulnerability scanner
        if: github.event_name != 'pull_request'

        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${PWD}:/workspace" \
            aquasec/trivy:0.65.0 image \
            --format sarif \
            --output /workspace/trivy-results.sarif \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-${{ matrix.suffix }}"

        continue-on-error: true

      - name: Upload SARIF results
        if: github.event_name != 'pull_request'

        uses: github/codeql-action/upload-sarif@v3

        with:
          sarif_file: trivy-results.sarif

        continue-on-error: true

      ####################################################################
      # Phase 8 — Grafana Reporting
      ####################################################################

      - name: Report build to Grafana Cloud
        if: always()

        uses: ./.github/actions/grafana-build-report

        with:
          status: ${{ job.status }}
          logs_url: ${{ secrets.GCLOUD_HOSTED_LOGS_URL }}
          logs_id: ${{ secrets.GCLOUD_HOSTED_LOGS_ID }}
          api_key: ${{ secrets.GCLOUD_RW_API_KEY }}
          grafana_url: ${{ secrets.GCLOUD_GRAFANA_URL }}
          extra_labels: |
            {
              "docker_target":"${{ matrix.target }}",
              "docker_suffix":"${{ matrix.suffix }}"
            }

      ####################################################################
      # Phase 9 — Cleanup
      ####################################################################

      - name: Cleanup build artifacts
        if: always()

        run: |
          echo "=== Final cleanup ==="

          docker builder prune -af || true

          docker system prune -af --volumes || true

          df -h

          echo "✅ Cleanup complete"

  ##########################################################################
  # IMAGE TESTING
  ##########################################################################

  test-images:
    needs: build-and-push

    runs-on: ubuntu-latest

    if: github.event_name != 'pull_request'

    strategy:
      fail-fast: false

      matrix:
        include:
          - target: cpu-build
            suffix: cpu
            port_map: 3001:3001
            health_url: http://localhost:3001/health

          - target: gpu-build
            suffix: gpu
            port_map: 3002:3002
            health_url: http://localhost:3002/

    steps:
      ####################################################################
      # Required for local composite actions
      ####################################################################

      - name: Checkout repository
        uses: actions/checkout@v4

      ####################################################################
      # Registry Login
      ####################################################################

      - name: Log in to GHCR
        uses: docker/login-action@v3

        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      ####################################################################
      # Pull + Test
      ####################################################################

      - name: Pull and test image

        run: |
          echo "=== Testing image: ${{ matrix.suffix }} ==="

          docker pull \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-${{ matrix.suffix }}

          docker run -d \
            --name test-container \
            -p ${{ matrix.port_map }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-${{ matrix.suffix }}

          echo "Waiting for container startup..."

          sleep 15

          echo "Running health check..."

          curl -f ${{ matrix.health_url }}

          echo "Stopping container..."

          docker stop test-container

          docker rm test-container

          echo "✅ Test passed"

      ####################################################################
      # Grafana Reporting
      ####################################################################

      - name: Report build to Grafana Cloud
        if: always()

        uses: ./.github/actions/grafana-build-report

        with:
          status: ${{ job.status }}
          logs_url: ${{ secrets.GCLOUD_HOSTED_LOGS_URL }}
          logs_id: ${{ secrets.GCLOUD_HOSTED_LOGS_ID }}
          api_key: ${{ secrets.GCLOUD_RW_API_KEY }}
          grafana_url: ${{ secrets.GCLOUD_GRAFANA_URL }}
          extra_labels: |
            {
              "docker_target":"${{ matrix.target }}",
              "docker_suffix":"${{ matrix.suffix }}"
            }
