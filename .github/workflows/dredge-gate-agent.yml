name: Dredge Gate Agent

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, dev, 'release/**']
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write
  pull-requests: write

env:
  GATE_VERSION: '0.2'
  GATE_STRICT_MODE: ${{ vars.GATE_STRICT_MODE || 'false' }}

jobs:
  gate-agent:
    name: Gate Agent
    runs-on: ubuntu-latest
    outputs:
      risk_score: ${{ steps.classify.outputs.risk_score }}
      verdict: ${{ steps.classify.outputs.verdict }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize upstream references
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          M365_REPO="OfficeDev/microsoft-365-agents-toolkit"
          ACTIONS_REPO="openai/codex-action"

          M365_SHA=$(git ls-remote "https://github.com/${M365_REPO}.git" HEAD | awk '{print $1}')
          CODEX_SHA=$(git ls-remote "https://github.com/${ACTIONS_REPO}.git" HEAD | awk '{print $1}')

          echo "m365_repo=$M365_REPO" >> "$GITHUB_OUTPUT"
          echo "codex_repo=$ACTIONS_REPO" >> "$GITHUB_OUTPUT"
          echo "m365_sha=$M365_SHA" >> "$GITHUB_OUTPUT"
          echo "codex_sha=$CODEX_SHA" >> "$GITHUB_OUTPUT"

          echo "Microsoft 365 toolkit HEAD: $M365_SHA"
          echo "Codex action HEAD: $CODEX_SHA"

      - name: Detect Changed Files
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD || true)
          fi

          echo "changed_files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGED" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Intent Classification
        id: classify
        shell: bash
        run: |
          set -euo pipefail

          SCORE=0
          VERDICT="low"
          CHANGED="${{ steps.changes.outputs.changed_files }}"

          echo "----- DREDGE GATE ANALYSIS -----"
          echo "$CHANGED"

          if echo "$CHANGED" | grep -E '^\.github/workflows/' >/dev/null; then
            echo "Workflow mutation detected"
            SCORE=$((SCORE + 40))
          fi

          if echo "$CHANGED" | grep -Ei '(secret|token|credential|auth|permission)' >/dev/null; then
            echo "Sensitive auth surface detected"
            SCORE=$((SCORE + 25))
          fi

          if echo "$CHANGED" | grep -Ei '(docker|terraform|deploy|k8s|helm)' >/dev/null; then
            echo "Infrastructure mutation detected"
            SCORE=$((SCORE + 30))
          fi

          if echo "$CHANGED" | grep -Ei '(gate-agent|self-hosted|dispatch|workflow_run)' >/dev/null; then
            echo "Recursive execution surface detected"
            SCORE=$((SCORE + 35))
          fi

          if echo "$CHANGED" | grep -Ei '(package-lock|pnpm-lock|yarn.lock|requirements.txt)' >/dev/null; then
            echo "Dependency graph mutation detected"
            SCORE=$((SCORE + 15))
          fi

          BIN_CHANGED=$(echo "$CHANGED" | grep -Ei '\.(exe|dll|bin)$' || true)
          if [[ -n "$BIN_CHANGED" ]]; then
            echo "Binary artifact change detected"
            SCORE=$((SCORE + 50))
          fi

          if [[ $SCORE -ge 80 ]]; then
            VERDICT="critical"
          elif [[ $SCORE -ge 50 ]]; then
            VERDICT="high"
          elif [[ $SCORE -ge 25 ]]; then
            VERDICT="medium"
          fi

          echo "risk_score=$SCORE" >> "$GITHUB_OUTPUT"
          echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"

      - name: Historical Failure Heuristics
        id: feedback
        shell: bash
        run: |
          set -euo pipefail
          echo "Analyzing historical telemetry..."
          FAILED_RUNS=$(gh run list --limit 20 --json conclusion --jq '[.[] | select(.conclusion=="failure")] | length' || echo 0)
          if [[ "$FAILED_RUNS" -gt 5 ]]; then
            echo "feedback_state=unstable" >> "$GITHUB_OUTPUT"
          else
            echo "feedback_state=stable" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Policy Enforcement
        shell: bash
        run: |
          set -euo pipefail
          VERDICT="${{ steps.classify.outputs.verdict }}"
          STRICT="${{ env.GATE_STRICT_MODE }}"

          if [[ "$STRICT" == "true" && "$VERDICT" == "critical" ]]; then
            echo "CRITICAL RISK BLOCKED"
            exit 1
          fi

          if [[ "$VERDICT" == "high" ]]; then
            echo "::warning::High risk mutation detected"
          fi
          if [[ "$VERDICT" == "critical" ]]; then
            echo "::warning::Critical execution surface detected"
          fi

      - name: Annotate Pull Request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = `## 🜂 Dredge Gate Agent

| Signal | Value |
|---|---|
| Risk Score | ${{ steps.classify.outputs.risk_score }} |
| Verdict | ${{ steps.classify.outputs.verdict }} |
| Feedback State | ${{ steps.feedback.outputs.feedback_state }} |
| Gate Version | ${process.env.GATE_VERSION} |
| M365 Toolkit Repo | ${{ steps.sync.outputs.m365_repo }} |
| M365 Toolkit HEAD | ${{ steps.sync.outputs.m365_sha }} |
| Codex Action Repo | ${{ steps.sync.outputs.codex_repo }} |
| Codex Action HEAD | ${{ steps.sync.outputs.codex_sha }} |
`
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            })

      - name: Export Telemetry
        if: always() && env.DREDGE_WEBHOOK != ''
        shell: bash
        run: |
          set -euo pipefail
          payload=$(jq -n \
            --arg repo "${{ github.repository }}" \
            --arg actor "${{ github.actor }}" \
            --arg verdict "${{ steps.classify.outputs.verdict }}" \
            --arg score "${{ steps.classify.outputs.risk_score }}" \
            --arg run "${{ github.run_id }}" \
            --arg feedback "${{ steps.feedback.outputs.feedback_state }}" \
            --arg m365_sha "${{ steps.sync.outputs.m365_sha }}" \
            --arg codex_sha "${{ steps.sync.outputs.codex_sha }}" \
            '{repository:$repo,actor:$actor,verdict:$verdict,risk_score:$score,run_id:$run,feedback_state:$feedback,m365_toolkit_sha:$m365_sha,codex_action_sha:$codex_sha}')
          curl -X POST -H "Content-Type: application/json" -d "$payload" "${{ secrets.DREDGE_WEBHOOK }}"
        env:
          DREDGE_WEBHOOK: ${{ secrets.DREDGE_WEBHOOK }}

      - name: Final Gate State
        shell: bash
        run: |
          echo "DREDGE GATE COMPLETE"
          echo "Version: $GATE_VERSION"
          echo "Risk: ${{ steps.classify.outputs.risk_score }}"
          echo "Verdict: ${{ steps.classify.outputs.verdict }}"
          echo "Feedback: ${{ steps.feedback.outputs.feedback_state }}"
