name: Fi Slide & Document Sandbox CI

on:
  push:
    paths:
      - 'integrations/fi-slide-doc-sandbox/**'
      - '.github/workflows/fi-slide-doc-sandbox.yml'
  pull_request:
    paths:
      - 'integrations/fi-slide-doc-sandbox/**'
      - '.github/workflows/fi-slide-doc-sandbox.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/fi-slide-doc-sandbox
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Syntax check
        run: npm run check
      - name: Smoke test server
        run: |
          node server/index.mjs > /tmp/fi-sandbox.log 2>&1 &
          PID=$!
          trap 'kill $PID' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8787/api/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/fi-sandbox.log
          exit 1

  thresh:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Thresh workflow analysis
        uses: QueenFi703/QueenFi703-thresh-agent@51ff51974276e0d8b9488742ab1b5965e0163ead
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          commit-fixes: 'false'
          pr-number: ${{ github.event.pull_request.number }}
