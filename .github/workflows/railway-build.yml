name: Railway Image Build

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/railway-build.yml'
      - 'Dockerfile.railway'
      - '.dockerignore'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'setup.py'
      - 'MANIFEST.in'
      - 'src/**'
      - 'start.sh'
      - 'docker-entrypoint.sh'
      - 'wsgi.py'
      - 'README.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  railway-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Build the Railway runtime image
        env:
          DOCKER_BUILDKIT: '1'
        run: docker build --file Dockerfile.railway --tag dredge-studio:railway-ci .
