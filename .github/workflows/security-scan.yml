name: Security Scan (Bandit + Checkov)

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read
  security-events: write

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-security-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-security-pip-

      - name: Install scanners
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install 'bandit[sarif]' checkov

      - name: Run Bandit (SARIF)
        run: |
          set -euo pipefail
          bandit -r . -f sarif -o bandit.sarif --exit-zero

      - name: Run Checkov (SARIF)
        run: |
          set -euo pipefail
          mkdir -p checkov-output
          checkov -d . -o sarif --output-file-path checkov-output --soft-fail
          cp checkov-output/results_sarif.sarif checkov.sarif

      - name: Verify SARIF files
        id: verify_sarif
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          for filename, tool in [('bandit.sarif', 'bandit'), ('checkov.sarif', 'checkov')]:
              report = json.loads(Path(filename).read_text())
              assert report.get('version') == '2.1.0', f'Invalid SARIF version: {filename}'
              runs = report.get('runs')
              assert isinstance(runs, list) and runs, f'No scanner runs: {filename}'
              assert all(run.get('tool', {}).get('driver', {}).get('name', '').lower() == tool
                         for run in runs), f'Unexpected scanner: {filename}'
              print(f'Validated {filename}')
          PY

      - name: Upload Bandit SARIF
        if: always() && steps.verify_sarif.outcome == 'success'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: bandit.sarif

      - name: Upload Checkov SARIF
        if: always() && steps.verify_sarif.outcome == 'success'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: checkov.sarif

      - name: Upload SARIF artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-scan-sarif-${{ github.run_id }}
          path: |
            bandit.sarif
            checkov.sarif
          if-no-files-found: ignore
          retention-days: 7
