version: 1
system:
  name: DREDGE
  canonical_contract: dredge.manifest.yaml
  description: Single-source-of-truth orchestration system.

policies:
  deterministic_runtime: true
  append_only_events: true
  state_changes_must_come_from_events: true
  execution_must_follow_declared_edges: true

telemetry:
  enabled: true
  event_log:
    mode: append_only
    replayable: true
    causally_linked: true

agents:
  - id: Forge
    role: execution
  - id: Sentinel
    role: policy_enforcement
  - id: Oracle
    role: inference
  - id: Replay
    role: state_reconstruction
  - id: Gate
    role: transition_authorization

graph:
  states:
    - contract_loaded
    - transition_authorized
    - agent_executing
    - event_emitted
    - state_reconstructed
  edges:
    - from: contract_loaded
      to: transition_authorized
      via: Gate
    - from: transition_authorized
      to: agent_executing
      via: Forge
    - from: agent_executing
      to: event_emitted
      via: Sentinel
    - from: event_emitted
      to: state_reconstructed
      via: Replay

projections:
  infrastructure:
    derived_only: true
    includes:
      - github_actions
      - docker
      - deployment_manifests
  documentation:
    derived_only: true
  ux:
    derived_only: true
    onboarding_model:
      name: "5:24"
      max_time_seconds: 324
      read_only: true
      authoritative: false
