<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fi — Slide & Document Sandbox</title>
<style>:root{--ink:#161616;--muted:#747474;--line:#dedbd5;--paper:#f7f5f2;--card:#fff;--accent:#6b5cff}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;background:var(--paper);color:var(--ink)}.app{display:grid;grid-template-columns:320px 1fr;min-height:100vh}.rail{border-right:1px solid var(--line);padding:24px;background:#fbfaf8}.brand{font-weight:800;font-size:20px}.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:34px}.mode{display:flex;gap:8px;margin:12px 0}.mode button,.export button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;cursor:pointer}.mode button.active{background:var(--ink);color:#fff}.rail textarea{width:100%;min-height:230px;resize:vertical;border:1px solid var(--line);border-radius:14px;padding:14px;font:inherit;background:#fff}.controls{display:flex;gap:8px;margin-top:10px}.controls select{flex:1;border:1px solid var(--line);border-radius:10px;padding:9px;background:#fff}.generate{width:100%;margin-top:10px;border:0;border-radius:12px;padding:13px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}.generate:disabled{opacity:.5}.hint{font-size:12px;color:var(--muted);line-height:1.5;margin-top:12px}.main{padding:28px 36px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.title{font-size:28px;font-weight:800}.export{display:flex;gap:8px}.canvas{max-width:1050px;margin:auto}.empty{border:1px dashed #c8c4bd;border-radius:20px;min-height:600px;display:grid;place-items:center;color:var(--muted);background:#faf9f7}.grid{display:grid;gap:18px}.slide{background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;min-height:360px;box-shadow:0 5px 20px #00000008}.slide .num{font-size:11px;color:var(--muted);letter-spacing:.12em}.slide h2{font-size:27px;margin:22px 0 8px}.slide .sub{color:var(--muted);font-size:15px}.slide ul{margin-top:28px;line-height:1.8}.doc{background:#fff;border:1px solid var(--line);border-radius:18px;padding:55px 70px;line-height:1.75}.doc h1{font-size:34px}.doc h2{margin-top:35px}.status{font-size:12px;color:var(--muted)}</style></head>
<body><div class="app"><aside class="rail"><div class="brand">FI / STUDIO</div><div class="eyebrow">Create</div><div class="mode"><button id="presentation" class="active">Slides</button><button id="document">Doc</button></div><textarea id="prompt" placeholder="Describe what you want to make…\n\nExample: Build a 7-slide vision deck for DREDGE explaining its memory, reasoning and emergence architecture."></textarea><div class="controls"><select id="count"><option>4</option><option selected>6</option><option>8</option><option>10</option><option>12</option></select><span class="status" id="status">Ready</span></div><label style="display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12px"><input id="useDredge" type="checkbox" checked> Use DREDGE context</label><button class="generate" id="generate">Generate with GPT + DREDGE</button><div class="hint">GPT creates the structured artifact, DREDGE supplies advisory context, and the sandbox renders PPTX/DOCX output.</div></aside><main class="main"><div class="top"><div class="title" id="artifactTitle">Your canvas</div><div class="export"><button id="pptx">Export PPTX</button><button id="docx">Export DOCX</button></div></div><div class="canvas" id="canvas"><div class="empty">Your generated artifact will appear here.</div></div></main></div>
<script>let kind="presentation",artifact=null;const $=id=>document.getElementById(id);function setMode(next){kind=next;$("presentation").classList.toggle("active",kind==="presentation");$("document").classList.toggle("active",kind==="document");$("count").style.display=kind==="presentation"?"block":"none"}$("presentation").onclick=()=>setMode("presentation");$("document").onclick=()=>setMode("document");function esc(x){return String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function render(data){artifact=data;$("artifactTitle").textContent=data.title||"Untitled";if(data.kind==="presentation")$("canvas").innerHTML='<div class="grid">'+(data.slides||[]).map((s,i)=>`<article class="slide"><div class="num">SLIDE ${i+1}</div><h2>${esc(s.title)}</h2><div class="sub">${esc(s.subtitle||"")}</div><ul>${(s.bullets||[]).map(b=>`<li>${esc(b)}</li>`).join("")}</ul></article>`).join("")+"</div>";else $("canvas").innerHTML='<article class="doc"><h1>'+esc(data.title)+'</h1>'+(data.sections||[]).map(s=>`<section><h2>${esc(s.heading)}</h2>${(s.paragraphs||[]).map(p=>`<p>${esc(p)}</p>`).join("")}</section>`).join("")+"</article>"}$("generate").onclick=async()=>{$("generate").disabled=true;$("status").textContent="Thinking…";try{const r=await fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt:$("prompt").value,kind,count:Number($("count").value),useDredge:$("useDredge").checked})});const d=await r.json();if(!r.ok)throw new Error(d.error);render(d);$("status").textContent="Ready"}catch(e){$("status").textContent=e.message}finally{$("generate").disabled=false}};async function download(url){if(!artifact)return;$("status").textContent="Exporting…";const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(artifact)});if(!r.ok)throw new Error(await r.text());const blob=await r.blob(),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=(artifact.title||"artifact")+"."+(url.endsWith("pptx")?"pptx":"docx");a.click();URL.revokeObjectURL(a.href);$("status").textContent="Ready"}$("pptx").onclick=()=>download("/api/export/pptx");$("docx").onclick=()=>download("/api/export/docx");</script></body></html>
