[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "dredge-studio"
version = "2.0.0"
description = "Advanced Security Intelligence and Model Management Platform"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [
    { name = "DREDGE Team", email = "team@dredge.dev" }
]
keywords = [
    "security",
    "vulnerability",
    "dependabot",
    "fibot",
    "dredge",
    "ai",
    "intelligence",
    "models",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]

dependencies = [
    "flask>=2.0.0",
    "requests>=2.25.0",
    "numpy>=1.19.0",
    "torch>=2.0.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=6.0.0",
    "pytest-cov>=2.12.0",
    "black>=21.0",
    "flake8>=3.9.0",
    "mypy>=0.910",
]
gpu = [
    "torch-cuda>=2.0.0",
]
all = [
    "pytest>=6.0.0",
    "pytest-cov>=2.12.0",
    "black>=21.0",
    "flake8>=3.9.0",
    "mypy>=0.910",
]

[project.urls]
Homepage = "https://github.com/docker/dredge-cli-repo"
Documentation = "https://github.com/docker/dredge-cli-repo/wiki"
Repository = "https://github.com/docker/dredge-cli-repo"
Issues = "https://github.com/docker/dredge-cli-repo/issues"

[project.scripts]
dredge = "dredge.cli:main"
dredge-server = "dredge.server:run_server"
dredge-advanced = "dredge.server:run_advanced"

[tool.setuptools]
packages = ["dredge"]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
dredge = [
    "static/*.html",
    "static/*.css",
    "static/*.js",
]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_mode = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 100

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --cov=src/dredge --cov-report=term-missing"

[tool.coverage.run]
source = ["src/dredge"]
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
]
