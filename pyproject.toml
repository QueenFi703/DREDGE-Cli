[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dredge-auth-gateway"
version = "2.0.0"
description = "Production-grade API key management and unified authentication middleware for Orion Gateway"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [
    {name = "DREDGE Dev", email = "dev@dredge.ai"}
]
keywords = [
    "authentication",
    "api-key",
    "middleware",
    "rate-limiting",
    "gateway",
    "orion",
    "dredge"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

dependencies = [
    "fastapi==0.104.1",
    "uvicorn==0.24.0",
    "httpx==0.25.0",
    "python-dotenv==1.0.0",
    "pydantic==2.4.2"
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "black==23.11.0",
    "flake8==6.1.0",
    "mypy==1.7.0"
]

[project.urls]
Homepage = "https://github.com/QueenFi703/DREDGE-Cli"
Repository = "https://github.com/QueenFi703/DREDGE-Cli.git"
Documentation = "https://github.com/QueenFi703/DREDGE-Cli#readme"
Issues = "https://github.com/QueenFi703/DREDGE-Cli/issues"

# Tool configurations
[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_mode = 3
include_trailing_comma = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

# Vercel deployment configuration
# Entry point: api/gateway.py which exports 'app' (FastAPI instance)
[tool.vercel]
entrypoint = "api.gateway:app"
buildCommand = "pip install -r requirements.txt"

# Environment variables for Vercel
[tool.vercel.env]
PYTHONUNBUFFERED = "true"
PYTHONDONTWRITEBYTECODE = "true"
FLASK_ENV = "production"
AUTH_STORAGE_PATH = "/tmp/api_keys.json"
LOG_LEVEL = "INFO"
ENABLE_RATE_LIMITING = "true"

# Railway deployment configuration (for reference)
[tool.railway]
# Use railway.toml instead for Railway deployment
# railway.toml has priority over this section

# Docker configuration
[tool.docker]
image = "dredge-auth-gateway:latest"
dockerfile = "Dockerfile.prod"
ports = [9000]
healthcheck = "/health"

# Development configuration
[tool.setuptools]
packages = ["dredge"]

[tool.setuptools.package-data]
dredge = ["static/**/*"]
