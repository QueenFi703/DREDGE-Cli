[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.railway"

[deploy]
# Start command uses Gunicorn with WSGI entry point
# Railway automatically sets PORT environment variable
startCommand = "gunicorn --bind 0.0.0.0:${PORT:-3001} --workers 4 --worker-class sync --timeout 120 --access-logfile - --error-logfile - wsgi:app"

# Environment configuration
[env]
FLASK_ENV = "production"
PYTHONUNBUFFERED = "1"
PYTHONDONTWRITEBYTECODE = "1"

# Restart policy
[restart]
on = "on_failure"
max_attempts = 3

# Health check configuration
[healthCheck]
path = "/health"
interval = 30
timeout = 5
startPeriod = 20
successThreshold = 1
failureThreshold = 3

# Metadata for Railway
[metadata]
name = "DREDGE Studio"
description = "Production-ready AI platform with 10-layer architecture and Gordon integration"
version = "2.0.0"
icon = "https://avatars.githubusercontent.com/u/1234567?v=4"

# Railway specific settings
[railway]
autoDeploy = true
envVariableReference = true
nixpacks = false
