[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile.railway"

[deploy]
# Start command uses Gunicorn with WSGI entry point
# Railway automatically sets PORT environment variable
startCommand = "gunicorn --bind 0.0.0.0:$PORT --workers 4 --worker-class sync --timeout 120 --access-logfile - --error-logfile - wsgi:app"
healthCheckPath = "/health"

# Environment configuration
[env]
FLASK_ENV = "production"
PYTHONUNBUFFERED = "1"
PYTHONDONTWRITEBYTECODE = "1"
