<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — DREDGE</title>
  <script type="module">
    import { getWebInstrumentations, initializeFaro } from 'https://esm.sh/@grafana/faro-web-sdk@1.10.0';
    import { TracingInstrumentation } from 'https://esm.sh/@grafana/faro-web-tracing@1.10.0';

    initializeFaro({
      url: 'https://faro-collector-prod-us-east-3.grafana.net/collect/7b8f7cd600e554e1beebfb586a41a332',
      app: {
        name: 'DREDGE',
        version: '1.0.0',
        environment: 'production'
      },
      sessionTracking: {
        samplingRate: 1,
        persistent: true
      },
      instrumentations: [
        ...getWebInstrumentations(),
        new TracingInstrumentation(),
      ],
    });
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   Helvetica, Arial, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    .logo {
      font-size: 2rem;
      margin-bottom: 0.4rem;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #e6edf3;
      margin-bottom: 0.25rem;
    }

    .tagline {
      font-size: 0.85rem;
      color: #8b949e;
      margin-bottom: 2rem;
    }

    .error-banner {
      display: none;
      background: #3d1f1f;
      border: 1px solid #f85149;
      border-radius: 6px;
      color: #f85149;
      font-size: 0.82rem;
      padding: 0.6rem 0.9rem;
      margin-bottom: 1.25rem;
      text-align: left;
    }
    .error-banner.visible { display: block; }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      width: 100%;
      padding: 0.72rem 1rem;
      border-radius: 8px;
      border: 1px solid transparent;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.15s, box-shadow 0.15s;
      margin-bottom: 0.9rem;
    }
    .btn:hover { opacity: 0.88; box-shadow: 0 2px 8px rgba(0,0,0,0.35); }
    .btn:active { opacity: 0.75; }
    .btn:last-child { margin-bottom: 0; }

    .btn-google {
      background: #ffffff;
      color: #3c4043;
      border-color: #dadce0;
    }

    .btn-github {
      background: #238636;
      color: #ffffff;
      border-color: #2ea043;
    }

    .btn svg { flex-shrink: 0; }

    .divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      color: #30363d;
      font-size: 0.8rem;
      margin: 1.1rem 0;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #30363d;
    }

    .footer {
      margin-top: 1.75rem;
      font-size: 0.75rem;
      color: #6e7681;
      line-height: 1.5;
    }
    .footer a { color: #58a6ff; text-decoration: none; }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">⚓</div>
    <h1>DREDGE</h1>
    <p class="tagline">GPU‑CPU Lifter · Save · Files · Print</p>

    <div class="error-banner" id="errorBanner"></div>

    <!-- Google login -->
    <a class="btn btn-google" href="/auth/google" id="googleBtn">
      <!-- Google "G" logo -->
      <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
        <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z" fill="#4285F4"/>
        <path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/>
        <path d="M3.964 10.707A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.707V4.961H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.039l3.007-2.332z" fill="#FBBC05"/>
        <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.961L3.964 7.293C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
      </svg>
      Continue with Google
    </a>

    <div class="divider">or</div>

    <!-- GitHub login -->
    <a class="btn btn-github" href="/auth/github" id="githubBtn">
      <!-- GitHub mark -->
      <svg width="18" height="18" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0 1 12 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/>
      </svg>
      Continue with GitHub
    </a>

    <p class="footer">
      By signing in you agree to the
      <a href="https://github.com/QueenFi703/DREDGE-Cli/blob/main/LICENSE" target="_blank" rel="noopener">MIT License terms</a>.
      <br>Your credentials are never stored by DREDGE.
    </p>
  </div>

  <script>
    // Surface error messages from the query string (set by the OAuth callbacks)
    const params = new URLSearchParams(window.location.search);
    const err = params.get("error");
    if (err) {
      const banner = document.getElementById("errorBanner");
      const messages = {
        google_auth_failed: "Google sign-in failed. Please try again.",
        github_auth_failed: "GitHub sign-in failed. Please try again.",
      };
      banner.textContent = messages[err] || "Sign-in failed. Please try again.";
      banner.classList.add("visible");
    }

    // Disable buttons while redirect is in progress to prevent double-clicks
    document.querySelectorAll(".btn").forEach(btn => {
      btn.addEventListener("click", () => {
        btn.style.opacity = "0.5";
        btn.style.pointerEvents = "none";
      });
    });
  </script>
</body>
</html>
